 CONFIG
 Editar solamente este bloque

novios:"Camila & Mateo",

frase:"Hay momentos que duran un instante, pero los recuerdos permanecen para siempre.",

ceremonia:"Parroquia San José",

<style>

*{

margin:0;

padding:0;

box-sizing:border-box;

}

html{

scroll-behavior:smooth;

}

body{

font-family:Georgia,"Times New Roman",serif;

background:#efe8df;

color:#4b433e;

overflow-x:hidden;

}

:root{

--principal:#8d6d62;

--secundario:#b89787;

--papel:#faf7f3;

--texto:#4b433e;

--radio:28px;

--sombra:
0 18px 45px rgba(0,0,0,.12);

}

body::before{

content:"";

position:fixed;

inset:0;

background:
linear-gradient(rgba(255,255,255,.45),rgba(255,255,255,.45));

z-index:-2;

}

section{

padding:90px 20px;

display:flex;

justify-content:center;

}

.paper{

width:min(900px,100%);

background:var(--papel);

border-radius:var(--radio);

padding:65px 40px;

position:relative;

box-shadow:var(--sombra);

overflow:hidden;

}

.paper::before{

content:"";

position:absolute;

left:0;

right:0;

top:-18px;

height:36px;

background:

radial-gradient(circle at 14px 28px,
transparent 12px,
var(--papel) 13px);

background-size:28px 36px;

}

.paper::after{

content:"";

position:absolute;

left:0;

right:0;

bottom:-18px;

height:36px;

background:

radial-gradient(circle at 14px 10px,
transparent 12px,
var(--papel) 13px);

background-size:28px 36px;

}
  /*======================================================
 HERO
======================================================*/

.hero{

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:40px;

position:relative;

overflow:hidden;

}

.hero::before{

content:"";

position:absolute;

inset:0;

background-size:cover;

background-position:center;

background-repeat:no-repeat;

transform:scale(1.08);

animation:zoomHero 18s ease-in-out infinite alternate;

filter:brightness(.95);

}

@keyframes zoomHero{

from{

transform:scale(1.08);

}

to{

transform:scale(1.16);

}

}

.heroCard{

position:relative;

z-index:2;

width:min(720px,92%);

background:rgba(250,247,243,.96);

padding:70px 45px;

border-radius:var(--radio);

box-shadow:var(--sombra);

text-align:center;

backdrop-filter:blur(4px);

}

.heroCard::before{

content:"";

position:absolute;

left:0;

right:0;

top:-18px;

height:36px;

background:

radial-gradient(circle at 14px 28px,
transparent 12px,
var(--papel) 13px);

background-size:28px 36px;

}

.heroCard::after{

content:"";

position:absolute;

left:0;

right:0;

bottom:-18px;

height:36px;

background:

radial-gradient(circle at 14px 10px,
transparent 12px,
var(--papel) 13px);

background-size:28px 36px;

}

/*======================================================
 TIPOGRAFÍA
======================================================*/

h1{

font-size:clamp(3rem,7vw,5.4rem);

font-weight:400;

color:var(--principal);

line-height:1.1;

margin-bottom:18px;

}

h2{

font-size:2.3rem;

font-weight:400;

color:var(--principal);

text-align:center;

margin-bottom:18px;

}

.subtitulo{

letter-spacing:6px;

text-transform:uppercase;

font-size:1rem;

color:var(--secundario);

margin-bottom:20px;

}

p{

line-height:1.9;

font-size:1.08rem;

}

/*======================================================
 DIVISOR
======================================================*/

.divider{

width:130px;

height:2px;

margin:30px auto;

background:

linear-gradient(to right,
transparent,
var(--secundario),
transparent);

position:relative;

}

.divider::after{

content:"❦";

position:absolute;

left:50%;

top:50%;

transform:translate(-50%,-50%);

background:var(--papel);

padding:0 12px;

color:var(--principal);

font-size:20px;

}

/*======================================================
 BOTÓN PREMIUM
======================================================*/

.btn{

display:inline-block;

margin-top:30px;

padding:16px 36px;

border-radius:999px;

background:var(--principal);

color:white;

text-decoration:none;

letter-spacing:2px;

transition:.35s;

box-shadow:0 10px 22px rgba(0,0,0,.15);

}

.btn:hover{

transform:translateY(-4px);

background:var(--secundario);

}

/*======================================================
 ANIMACIONES
======================================================*/

.reveal{

opacity:0;

transform:translateY(45px);

transition:1s;

}

.reveal.visible{

opacity:1;

transform:none;

}

/*======================================================
 RESPONSIVE
======================================================*/

@media(max-width:768px){

.heroCard{

padding:55px 28px;

}

.paper{

padding:50px 24px;

}

h1{

font-size:3.3rem;

}

h2{

font-size:2rem;

}

  }
  </head>

<body>

<!-- ===================== HERO ===================== -->

<header class="hero" id="hero">

    <div class="heroCard reveal">

        <div class="subtitulo">Nos Casamos</div>

        <h1 id="novios"></h1>

        <div class="divider"></div>

        <p id="frase"></p>

        <a href="#bienvenida" class="btn">Ver invitación</a>

</header>

<!-- ===================== BIENVENIDA ===================== -->

<section id="bienvenida">

    <div class="paper reveal">

        <h2>Con mucha alegría</h2>

        <div class="divider"></div>

        <p>
            Queremos compartir con ustedes uno de los días más importantes de nuestras vidas.
            Su presencia hará que este momento sea aún más especial.
        </p>

    </div>

</section>

<!-- ===================== CUENTA REGRESIVA ===================== -->

<section>

    <div class="paper reveal">

        <h2>Faltan...</h2>

        <div class="divider"></div>

        <div class="countdown">

            <div class="box">
                <span id="dias">00</span>
                <small>Días</small>
            </div>

            <div class="box">
                <span id="horas">00</span>

            </div>

            <div class="box">
                <span id="minutos">00</span>
                <small>Minutos</small>
            </div>

            <div class="box">
                <span id="segundos">00</span>
                <small>Segundos</small>
            </div>

        </div>

    </div>

</section>

<!-- ===================== CEREMONIA ===================== -->

<section>

    <div class="paper reveal">

        <h2>Ceremonia</h2>

        <div class="divider"></div>

        <p id="ceremonia"></p>

        <p id="direccionCeremonia"></p>

        <br>

        <p id="fechaTexto"></p>

        <p id="hora"></p>

    </div>

</section>

<!-- ===================== FIESTA ===================== -->

<section>

    <div class="paper reveal">

        <h2>Celebración</h2>

        <div class="divider"></div>

        <p id="fiesta"></p>

        <p id="direccionFiesta"></p>

    </div>

</section>
  <!-- ===================== DRESS CODE ===================== -->

<section>

    <div class="paper reveal">

        <h2>Dress Code</h2>

        <div class="divider"></div>

        <p id="dresscode"></p>

    </div>

</section>

<!-- ===================== REGALOS ===================== -->

<section>

    <div class="paper reveal">

        <h2>Regalos</h2>

        <div class="divider"></div>

        <p>
            El mejor regalo es tu presencia en este día tan especial.
            Si deseas hacernos un obsequio, puedes hacerlo desde el siguiente botón.
        </p>

        <a id="btnRegalos" class="btn" target="_blank" href="#">
            Ver información
        </a>

    </div>

</section>

<!-- ===================== CONFIRMACIÓN ===================== -->

<section>

    <div class="paper reveal">

        <h2>Confirmar asistencia</h2>

        <div class="divider"></div>

        <p>
            Te pedimos confirmar tu asistencia antes del evento.
        </p>

        <a id="btnConfirmar" class="btn" target="_blank" href="#">
            Confirmar por WhatsApp
        </a>

    </div>

</section>

<!-- ===================== MÚSICA ===================== -->

<section>

    <div class="paper reveal">

        <h2>Nuestra canción</h2>

        <div class="divider"></div>

        <a id="btnMusica" class="btn" target="_blank" href="#">

        </a>

</section>

<!-- ===================== FOOTER ===================== -->

    <p style="opacity:.7;">Con amor</p>

    <h2 style="margin-top:10px;" id="noviosFooter"></h2>

</footer>
  <script>

/*======================================================
 ASIGNAR DATOS DESDE CONFIG
======================================================*/

const hero = document.getElementById("hero");

hero.style.backgroundImage =
`linear-gradient(rgba(255,255,255,.15),rgba(255,255,255,.55)),
url('${CONFIG.portada}')`;

document.getElementById("novios").textContent = CONFIG.novios;
document.getElementById("noviosFooter").textContent = CONFIG.novios;

document.getElementById("frase").textContent = CONFIG.frase;

document.getElementById("ceremonia").textContent = CONFIG.ceremonia;
document.getElementById("direccionCeremonia").textContent = CONFIG.direccionCeremonia;

document.getElementById("fiesta").textContent = CONFIG.fiesta;
document.getElementById("direccionFiesta").textContent = CONFIG.direccionFiesta;

document.getElementById("dresscode").textContent = CONFIG.dresscode;

document.getElementById("btnConfirmar").href = CONFIG.confirmarURL;
document.getElementById("btnRegalos").href = CONFIG.regalosURL;
document.getElementById("btnMusica").href = CONFIG.playlistURL;

/*======================================================
 FECHA EVENTO (IMPORTANTE: ISO)
======================================================*/

const fechaEvento = new Date(CONFIG.fechaEvento).getTime();

/*======================================================
 CUENTA REGRESIVA
======================================================*/

function countdown(){

const ahora = new Date().getTime();
const diff = fechaEvento - ahora;

if(diff <= 0){

document.getElementById("dias").textContent = "00";
document.getElementById("horas").textContent = "00";
document.getElementById("minutos").textContent = "00";
document.getElementById("segundos").textContent = "00";

return;

}

const dias = Math.floor(diff / (1000*60*60*24));
const horas = Math.floor((diff % (1000*60*60*24)) / (1000*60*60));
const minutos = Math.floor((diff % (1000*60*60)) / (1000*60));
const segundos = Math.floor((diff % (1000*60)) / 1000);

document.getElementById("dias").textContent = String(dias).padStart(2,"0");
document.getElementById("horas").textContent = String(horas).padStart(2,"0");
document.getElementById("minutos").textContent = String(minutos).padStart(2,"0");
document.getElementById("segundos").textContent = String(segundos).padStart(2,"0");

}

countdown();
setInterval(countdown,1000);

/*======================================================
 REVEAL ANIMATIONS
======================================================*/

const elements = document.querySelectorAll(".reveal");

const observer = new IntersectionObserver(entries=>{

entries.forEach(entry=>{

if(entry.isIntersecting){
entry.target.classList.add("visible");
}

});

},{threshold:0.15});

elements.forEach(el=>observer.observe(el));

/*======================================================
 FIN
======================================================*/

</script>

</body>

</html>
